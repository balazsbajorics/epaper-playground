<!doctype html>
<!-- The smallest integration: draw on an offscreen canvas with a bitmap font, submit it. -->
<meta charset="utf-8" />
<canvas id="screen" style="width: 480px; image-rendering: pixelated"></canvas>
<script type="module">
  import {createEpaperDisplay, preset, loadFonts, drawText} from '../src/index.js';

  const display = createEpaperDisplay(document.getElementById('screen'), preset('3.1'));
  const fonts = await loadFonts(['spleen-16x32', 'terminus-16']);
  const frame = document.createElement('canvas');
  frame.width = display.width;
  frame.height = display.height;
  const ctx = frame.getContext('2d');

  function render() {
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, frame.width, frame.height);
    ctx.fillStyle = '#000';
    drawText(ctx, fonts['spleen-16x32'], new Date().toLocaleTimeString(), 16, 120);
    drawText(ctx, fonts['terminus-16'], 'partial refresh every second', 16, 170);
    display.submit(frame); // partial refresh; display.submit(frame, {full: true}) for a clean one
  }
  render();
  setInterval(render, 1000);
</script>
